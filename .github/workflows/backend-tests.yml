name: Backend tests

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/exploreubc_test
      EVENT_SEARCH_STATE_CODE: BC
      EVENT_SEARCH_COUNTRY_CODE: CA
      QWEN_ENDPOINT: ${{ secrets.QWEN_ENDPOINT }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
      QWEN_TIMEOUT_MS: ${{ secrets.QWEN_TIMEOUT_MS }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GEOCODING_API_KEY: ${{ secrets.GEOCODING_API_KEY }}
      PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
      ROUTES_API_KEY: ${{ secrets.ROUTES_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run backend tests
        run: npm run test:combined --prefix backend
